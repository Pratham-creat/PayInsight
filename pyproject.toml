[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payinsight"
version = "0.1.0"
description = "Deterministic payroll risk analytics MVP"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "duckdb>=0.9", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["payinsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
